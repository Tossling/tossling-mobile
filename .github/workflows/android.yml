name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew :modules:common:protocol:jvmTest testDebugUnitTest assembleDebug assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: tossling-apk-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared protocol tests on the iOS simulator
        run: ./gradlew :modules:common:protocol:iosSimulatorArm64Test --console=plain
      - name: Build the iOS app for the simulator
        working-directory: ios
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
          xcodebuild -project Tossling.xcodeproj -scheme Tossling -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build | tail -20
