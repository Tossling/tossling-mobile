name: Tossling
options:
  bundleIdPrefix: com.kopylovis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: AG3425642R
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.19.2
targets:
  Tossling:
    type: application
    platform: iOS
    sources:
      - path: Tossling
    dependencies:
      - target: NotificationService
      - target: ShareExtension
      - package: Firebase
        product: FirebaseMessaging
      - sdk: AppIntents.framework
    info:
      path: Tossling/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FirebaseAppDelegateProxyEnabled: false
        UIAppFonts: [onest_regular.ttf, onest_medium.ttf, onest_semibold.ttf, onest_bold.ttf, jetbrains_mono_medium.ttf]
        UIBackgroundModes: [remote-notification]
    entitlements:
      path: Tossling/Tossling.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.kopylovis.tossling
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.kopylovis.tossling.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kopylovis.tossling
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../modules/common/protocol/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: -framework TosslingKit
        INFOPLIST_KEY_CFBundleDisplayName: Tossling
        INFOPLIST_KEY_NSCameraUsageDescription: Tossling scans the QR code that a computer shows to join its room.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
    preBuildScripts:
      - name: Build TosslingKit
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          export JAVA_HOME="$(/usr/libexec/java_home -v 21)"
          ./gradlew :modules:common:protocol:embedAndSignAppleFrameworkForXcode --console=plain
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
      - path: Tossling/Model/Keychain.swift
      - path: Tossling/Model/Server.swift
      - path: Tossling/Model/Feed.swift
      - path: Tossling/Model/History.swift
      - path: Tossling/Resources/Localizable.xcstrings
      - path: Tossling/Resources/PrivacyInfo.xcprivacy
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Tossling
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kopylovis.tossling
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.kopylovis.tossling.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kopylovis.tossling.notifications
        TARGETED_DEVICE_FAMILY: "1"
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../modules/common/protocol/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: -framework TosslingKit
        APPLICATION_EXTENSION_API_ONLY: YES
    preBuildScripts:
      - name: Build TosslingKit
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          export JAVA_HOME="$(/usr/libexec/java_home -v 21)"
          ./gradlew :modules:common:protocol:embedAndSignAppleFrameworkForXcode --console=plain
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Tossling/Model/Keychain.swift
      - path: Tossling/Model/Server.swift
      - path: Tossling/Model/History.swift
      - path: Tossling/Model/Feed.swift
      - path: Tossling/Model/Sender.swift
      - path: Tossling/Resources/Localizable.xcstrings
      - path: Tossling/Resources/PrivacyInfo.xcprivacy
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Tossling
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 5
              NSExtensionActivationSupportsFileWithMaxCount: 10
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kopylovis.tossling
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.kopylovis.tossling.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kopylovis.tossling.share
        TARGETED_DEVICE_FAMILY: "1"
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../modules/common/protocol/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: -framework TosslingKit
        APPLICATION_EXTENSION_API_ONLY: YES
    preBuildScripts:
      - name: Build TosslingKit
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          export JAVA_HOME="$(/usr/libexec/java_home -v 21)"
          ./gradlew :modules:common:protocol:embedAndSignAppleFrameworkForXcode --console=plain
